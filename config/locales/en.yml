# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  activerecord:
    errors:
      models:
        micropost:
          attributes:
            image:
              invalid_content_type: "must be a JPEG, PNG, or GIF"
              too_large: "should be less than 5 MB"
        relationship:
          attributes:
            followed:
              same_as_follower: "can't be the same as follower"
  app:
    title: "Ruby on Rails Tutorial Sample App"
    welcome: "Welcome to the Sample App!"
    auth:
      invalid_credentials: "Invalid email/password combination"
      account_not_activated: "Account not activated. Check your email for the activation link."
    account_activation:
      success: "Account activated!"
      invalid_link: "Invalid activation link"
    user:
      not_found: "User not found"
      profile_updated: "Profile updated"
      deleted: "User deleted"
      login_required: "Please log in."
    password_reset:
      email_sent: "Email sent with password reset instructions"
      email_not_found: "Email address not found"
      expired: "Password reset has expired."
      password_empty: "can't be empty"
      success: "Password has been reset."
    micropost:
      created: "Micropost created!"
      deleted: "Micropost deleted"

  user_mailer:
    account_activation:
      subject: "Account activation"
      delivery_notice: "Please check your email to activate your account."
    password_reset:
      subject: "Password reset"
